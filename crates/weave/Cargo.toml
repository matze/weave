[package]
name = "weave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.8.1", features = ["macros"] }
axum-extra = { version = "0.12.5", features = ["cookie-signed"] }
dom_smoothie = "0.18"
futures-concurrency = "7.6.3"
htmd = "0.5"
jiff = { version = "0.2", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
maud = { git = "https://github.com/lambda-fairy/maud", features = ["axum"] }
merman = { version = "=0.8.0-alpha.7", default-features = false, features = [
    "all-diagrams",
    "svg",
    "layout-cytoscape",
    "system-clock",
    "system-timezone",
    "system-random",
] }
notify = "8.0.0"
parking_lot = "0.12"
pulldown-cmark = "0.13"
rand = "0.10.0"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["standalone", "embed-fonts"] }
ratex-types = "0.1.14"
regex = "1.11.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
ring = "0.17.14"
serde = { version = "1.0.217", features = ["serde_derive"] }
serde_json = "1.0.150"
syntect = { version = "5", default-features = false, features = ["parsing", "html", "regex-fancy", "plist-load"] }
thiserror = "2.0.10"
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["compression-full", "fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
two-face = "0.5"
url = "2.5.8"
zk-rs = { path = "../zk-rs" }

[build-dependencies]
syntect = { version = "5", default-features = false, features = ["parsing", "html", "regex-fancy", "plist-load"] }
two-face = "0.5"
